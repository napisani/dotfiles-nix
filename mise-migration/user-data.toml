# User data every rollout backs up before changing a host. Cask paths come from
# installed Homebrew metadata; they are backup inputs, never zap targets.
# Regenerable paths are never copied and never touched.
[regenerable]
paths = ["Library/Caches", "Library/Logs", "Library/Saved Application State", "Library/Android/sdk", "Library/Containers/com.docker.docker/Data/vms", ".cache", ".npm/_cacache", ".npm/_logs"]

[apps.claude]
paths = [".claude", ".claude.json"]
credentials = [".claude/.credentials.json"]

[apps.codex]
paths = [".codex"]
credentials = [".codex/auth.json"]

[apps.pi]
paths = [".pi"]
credentials = [".pi/agent/auth.json"]

