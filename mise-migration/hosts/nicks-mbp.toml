# Rollout decisions for the personal ARM MacBook. Published: no addresses or personal data.
flake_name = "nicks-mbp"
checkout = "~/code/monorepo/pub/dotfiles-nix"
agent_profile = "common"
# The controller reaches this host through a Host alias in its own ~/.ssh/config.
controller = "nicks-loancrate-mbp"
ssh_alias = "nicks-mbp"

[casks]
transfer = "all"
# These installers need a macOS approval the agent cannot give; failures go to the wrap-up list.
needs_approval = ["karabiner-elements", "tailscale-app", "docker-desktop", "stats"]

[data]
protected = []
regenerable = []

[services]
# Stopped while casks transfer because they hold protected files open.
quiesce = [
  { domain = "gui", label = "org.pqrs.service.agent.karabiner_console_user_server" },
  { domain = "gui", label = "org.pqrs.service.agent.karabiner_session_monitor" },
  { domain = "gui", label = "org.pqrs.service.agent.Karabiner-Core-Service-rev2" },
  { domain = "gui", label = "org.pqrs.service.agent.Karabiner-Menu" },
  { domain = "gui", label = "org.pqrs.service.agent.Karabiner-NotificationWindow" },
  { domain = "system", label = "org.pqrs.service.daemon.Karabiner-Core-Service" },
  { domain = "system", label = "org.pqrs.service.daemon.Karabiner-VirtualHIDDevice-Daemon" },
]
quit_apps = ["Docker"]

[exceptions]
