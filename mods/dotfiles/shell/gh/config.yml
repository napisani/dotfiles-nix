# gh — previously generated by programs.gh in mods/gh.nix.
#
# These are gh's own defaults, written explicitly so the file has one owner.
# gh *extensions* (gh-stack) stay nix-managed: they're packages, and nix installs
# them into ~/.local/share/gh/extensions.
#
# Note that `git_protocol: https` is what makes gh's git credential helper the
# thing that authenticates pushes — see the credential section in git/config.
%YAML 1.1
---
aliases: {}
editor: ''
git_protocol: https
version: '1'
