# Primary terminal. alacritty.toml and ghostty-config mirror this file's palette
# and key mappings; keep all three in sync.

font_family      family="MesloLGSDZ Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
# kitty's default macOS text looks thinner than Alacritty/Ghostty, which render
# with CoreText smoothing; these two bring glyph weight back in line.
# Meslo's ~14.4px advance rounds up to 15px in kitty but down to 14px in
# Alacritty/Ghostty at 12pt on retina, so kitty cells came out wider.
modify_font               cell_width -1px
macos_thicken_font        0.25
text_composition_strategy legacy

# Kanagawa Dragon vivid terminal palette.
background            #1f1f28
foreground            #dcd7ba
cursor                #dcd7ba
cursor_text_color     #1f1f28
selection_background  #2d4f67
selection_foreground  #dcd7ba

color0  #1f1f28
color1  #ff5d62
color2  #98bb6c
color3  #ff9e3b
color4  #7fb4ca
color5  #c4a7e7
color6  #a3d4d5
color7  #dcd7ba
color8  #a6a69c
color9  #ff5d62
color10 #98bb6c
color11 #ff9e3b
color12 #7fb4ca
color13 #c4a7e7
color14 #a3d4d5
color15 #dcd7ba

# Defaults carried over from the previous Alacritty setup.
scrollback_lines                     10000
cursor_blink_interval                0
enable_audio_bell                    no
window_padding_width                 0
confirm_os_window_close              0
macos_quit_when_last_window_closed   yes
mouse_hide_wait                      0
# Shell integration would inject into the hand-managed bash setup.
shell_integration                    disabled

# Clipboard
map ctrl+v       paste_from_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard

# tmux requests modifyOtherKeys, which kitty does not implement. Explicit CSI-u
# inputs let tmux encode modified keys for each pane's mode, as in alacritty.toml.
map ctrl+slash   send_text all \x1f
map ctrl+q       send_text all \x1b[81;5u
map ctrl+shift+p send_text all \x1b[80;6u
map ctrl+shift+r send_text all \x1b[82;6u
map ctrl+shift+e send_text all \x1b[69;6u
map ctrl+shift+f send_text all \x1b[70;6u
map ctrl+shift+t send_text all \x1b[84;6u
map ctrl+shift+h send_text all \x1b[72;6u

# Specialty TUI chords, CSI-u encoded: ESC [ <keycode> ; <mods> u
# where mods: 2=Shift, 3=Alt, 5=Ctrl, 6=Ctrl+Shift.
map shift+enter          send_text all \x1b[13;2u
map ctrl+enter           send_text all \x1b[13;5u
map ctrl+shift+enter     send_text all \x1b[13;6u
map alt+enter            send_text all \x1b[13;3u
map alt+backspace        send_text all \x1b[127;3u
map ctrl+shift+backspace send_text all \x1b[127;6u
