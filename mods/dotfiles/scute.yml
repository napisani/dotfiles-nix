# ~/.config/scute/config.yaml
# Fallback config used for machines without a dedicated scute-<machine>.yml
# (see mods/shell.nix, which symlinks based on MACHINE_NAME). Providers used
# by prompts (env vars override these).
providers:
  - name: ollama
    baseUrl: http://localhost:11434
  - name: openai

clipboardCommand: "auto"
# Shell keybindings in universal syntax (rendered by scute init)
# shellKeybindings:
#   explain: []
#   build: "Ctrl+E"
#   suggest: []
#   generate: [] # disable if you do not want a binding

promptDefaults:
  provider: openai
  model: gpt-5.4
