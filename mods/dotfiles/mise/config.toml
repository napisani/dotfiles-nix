[settings]
all_compile = false
locked = true
locked_scopes = ["global"]
lockfile = true
lockfile_platforms = ["macos-arm64", "macos-x64", "linux-x64"]

# Shared merge targets may contain credentials, including recovery preimages.
[settings.history]
enabled = false

[settings.npm]
