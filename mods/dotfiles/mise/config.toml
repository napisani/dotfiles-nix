[bootstrap.hooks.post-tools]
run = "{{ mise_bin | quote }} -C {{ env.HOME | quote }} run apps:configure"

[tasks."runtime:prepare"]
description = "Install the locked skill-preparation environment"
run = "uv sync --locked --project {{ vars.dotfiles_root | quote }}/mise/runtime --python \"$({{ mise_bin | quote }} which python)\""

[tasks."nvim:prepare"]
description = "Install the locked Python provider in a checkout-independent environment"
run = """
python="$({{ mise_bin | quote }} which python)" || exit
UV_PROJECT_ENVIRONMENT="${XDG_DATA_HOME:-$HOME/.local/share}/dotfiles/nvim-python" uv sync --locked --project {{ vars.dotfiles_root | quote }}/nvim/python --python "$python"
"""

[tasks."skills:prepare"]
description = "Validate pinned sources and prepare skills offline"
depends = ["runtime:prepare"]
run = """
uv run --locked --project {{ vars.dotfiles_root | quote }}/mise/runtime --python "$({{ mise_bin | quote }} which python)" python {{ vars.dotfiles_root | quote }}/mise/runtime/mise/skills-prepare.py --catalog {{ vars.dotfiles_root | quote }}/../agents/skills.json --root {{ vars.monorepo_root | quote }} --config {{ env.HOME | quote }}/.config/mise/config.toml --config {{ env.HOME | quote }}/.config/mise/config.local.toml --profile {{ vars.agent_profile | quote }}
"""

[tasks."apps:configure"]
description = "Reconcile managed agent fields and skill links without replacing app state"
depends = ["skills:prepare", "nvim:prepare"]
run = [
  "uv run --locked --project {{ vars.dotfiles_root | quote }}/mise/runtime --python \"$({{ mise_bin | quote }} which python)\" python {{ vars.dotfiles_root | quote }}/mise/runtime/configure_apps.py {{ vars.dotfiles_root | quote }} {{ vars.agent_profile | quote }} {{ env.HOME | quote }}/.local/share/dotfiles/skills/claude-overrides.json",
  "{{ mise_bin | quote }} -C {{ env.HOME | quote }} dot apply '~'",
  "{{ mise_bin | quote }} completion bash --install",
]

[tasks."skills:sync"]
description = "Fetch pinned skill sources, prepare and deploy their group"
run = [
  "{{ mise_bin | quote }} -C {{ env.HOME | quote }} bootstrap repos apply",
  "{{ mise_bin | quote }} -C {{ env.HOME | quote }} run apps:configure",
]

[tasks."rtk:setup"]
description = "Initialize upstream RTK after its guarded ownership handoff"
run = "node {{ vars.dotfiles_root | quote }}/mise/runtime/mise/rtk-setup.cjs {{ mise_bin | quote }}"

